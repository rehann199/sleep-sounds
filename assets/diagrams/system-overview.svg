<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="t d">
  <title id="t">Sleep Sounds system overview</title>
  <desc id="d">A Flutter Android app with screens, Provider view-models, services for audio, downloads, notifications, purchases, ads and analytics, and a local preferences store plus cached audio files. Outside the device are remote object storage for audio, Firebase services, Google Play Billing and Google Mobile Ads.</desc>
  <defs>
    <style>
      text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #e8ebff; }
      .h { font-family: Georgia, "Times New Roman", serif; font-size: 28px; font-weight: 700; }
      .s { font-size: 15px; fill: #a9b0dd; }
      .k { font-size: 12px; font-weight: 700; letter-spacing: 1.6px; fill: #a9b0dd; }
      .t { font-size: 16px; font-weight: 700; }
      .b { font-size: 14px; fill: #cdd2f5; }
      .dev { fill: #0f1d3a; stroke: #5a67c9; stroke-width: 2; }
      .cloud { fill: #0f1d3a; stroke: #43b5a6; stroke-width: 2; }
      .layer { fill: #14233f; stroke: #5a67c9; stroke-width: 1.5; }
      .core { fill: #1c2c55; stroke: #9a97ff; stroke-width: 2; }
      .store { fill: #12302f; stroke: #43b5a6; stroke-width: 1.5; }
      .line { stroke: #9a97ff; stroke-width: 2; fill: none; }
      .teal { stroke: #43b5a6; stroke-width: 2; fill: none; }
    </style>
    <marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9a97ff"/>
    </marker>
    <marker id="at" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#43b5a6"/>
    </marker>
  </defs>
  <rect width="1200" height="620" rx="18" fill="#0b1730"/>
  <text x="40" y="52" class="h">One Flutter codebase, one playing sound</text>
  <text x="40" y="78" class="s">Screens read view-models; services wrap audio, storage, notifications, billing and ads.</text>

  <rect x="40" y="104" width="700" height="480" rx="16" class="dev"/>
  <text x="62" y="134" class="k">ON THE DEVICE (ANDROID)</text>

  <rect x="64" y="148" width="652" height="76" rx="12" class="layer"/>
  <text x="84" y="176" class="t">Screens</text>
  <text x="84" y="200" class="b">Splash, onboarding, home, library, favourites, player, settings, paywall, unlock sheet</text>

  <rect x="64" y="240" width="652" height="76" rx="12" class="layer"/>
  <text x="84" y="268" class="t">View-models (Provider)</text>
  <text x="84" y="292" class="b">Player, sleep timer, entitlements, favourites, settings, theme, language, tutorial</text>

  <rect x="64" y="332" width="652" height="116" rx="12" class="core"/>
  <text x="84" y="360" class="t">Services</text>
  <text x="84" y="384" class="b">Audio playback and session, download cache, local notifications and push,</text>
  <text x="84" y="404" class="b">purchases, ad gates and consent, in-app update prompt, analytics and</text>
  <text x="84" y="424" class="b">performance traces</text>

  <rect x="64" y="464" width="316" height="100" rx="12" class="store"/>
  <text x="84" y="492" class="t">Preferences store</text>
  <text x="84" y="516" class="b">Key-value settings, favourites,</text>
  <text x="84" y="536" class="b">timer and reminder choices,</text>
  <text x="84" y="556" class="b">entitlement flags</text>

  <rect x="400" y="464" width="316" height="100" rx="12" class="store"/>
  <text x="420" y="492" class="t">Cached audio files</text>
  <text x="420" y="516" class="b">One file per sound in app</text>
  <text x="420" y="536" class="b">storage, written through a</text>
  <text x="420" y="556" class="b">temporary name, then renamed</text>

  <path d="M390 224 V236" class="line" marker-end="url(#ar)"/>
  <path d="M390 316 V328" class="line" marker-end="url(#ar)"/>
  <path d="M222 448 V460" class="line" marker-end="url(#ar)"/>
  <path d="M558 448 V460" class="line" marker-end="url(#ar)"/>

  <rect x="800" y="104" width="360" height="480" rx="16" class="cloud"/>
  <text x="822" y="134" class="k">OUTSIDE THE DEVICE</text>

  <rect x="822" y="148" width="316" height="84" rx="12" class="layer"/>
  <text x="842" y="176" class="t">Remote object storage</text>
  <text x="842" y="200" class="b">Public audio files, streamed on</text>
  <text x="842" y="220" class="b">first play and downloaded</text>

  <rect x="822" y="248" width="316" height="104" rx="12" class="layer"/>
  <text x="842" y="276" class="t">Firebase</text>
  <text x="842" y="300" class="b">Firestore (ad-placement switches),</text>
  <text x="842" y="320" class="b">Cloud Messaging, Analytics,</text>
  <text x="842" y="340" class="b">Crashlytics, Performance</text>

  <rect x="822" y="368" width="316" height="84" rx="12" class="layer"/>
  <text x="842" y="396" class="t">Google Play</text>
  <text x="842" y="420" class="b">Billing for the subscription,</text>
  <text x="842" y="440" class="b">in-app update flow, in-app review</text>

  <rect x="822" y="468" width="316" height="96" rx="12" class="layer"/>
  <text x="842" y="496" class="t">Google Mobile Ads</text>
  <text x="842" y="520" class="b">Banner, native, interstitial,</text>
  <text x="842" y="540" class="b">app-open and rewarded formats,</text>
  <text x="842" y="560" class="b">with a consent form</text>

  <path d="M716 345 H760 V190 H818" class="teal" marker-end="url(#at)"/>
  <path d="M716 372 H772 V300 H818" class="teal" marker-end="url(#at)"/>
  <path d="M716 410 H818" class="teal" marker-end="url(#at)"/>
  <path d="M716 432 H784 V516 H818" class="teal" marker-end="url(#at)"/>
</svg>
